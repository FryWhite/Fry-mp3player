<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="《荔香墨韵》音乐播放页，作者：颜菲湘。">
    <title>荔香墨韵 - 音乐播放</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: grid; place-items: center; padding: 24px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #3f211d;
            background: radial-gradient(circle at 17% 18%, rgba(255,250,230,.92), transparent 26%),
                        radial-gradient(circle at 83% 80%, rgba(84,121,78,.25), transparent 30%),
                        linear-gradient(145deg, #f3e4bd, #c9b27d 52%, #6f8d70);
        }
        main {
            width: min(100%, 500px); padding: 48px 38px 40px; text-align: center;
            background: rgba(255,252,235,.75); border: 1px solid rgba(255,251,226,.9);
            border-radius: 30px; box-shadow: 0 24px 70px rgba(54,69,45,.24);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        }
        .emblem {
            width: 94px; height: 94px; display: grid; place-items: center; margin: 0 auto 24px;
            border-radius: 50%; color: #fff4d4; background: linear-gradient(145deg, #b64a3d, #6e2725);
            box-shadow: 0 0 0 10px rgba(152,55,47,.13), 0 0 0 20px rgba(88,119,76,.08);
        }
        .emblem svg { width: 42px; fill: currentColor; }
        h1 { font-family: "STKaiti", "KaiTi", serif; font-size: clamp(2rem,8vw,2.7rem); font-weight: 600; letter-spacing: .18em; text-indent: .18em; }
        .subtitle { margin: 10px 0 30px; color: #73634b; font-size: .9rem; letter-spacing: .32em; text-indent: .32em; }
        audio { width: 100%; margin-bottom: 27px; }
        .divider { width: 70px; height: 1px; margin: 0 auto 18px; background: linear-gradient(90deg,transparent,#897252,transparent); }
        .author { display: flex; justify-content: center; align-items: baseline; gap: 10px; }
        .author .label { color: #86745d; font-size: .82rem; letter-spacing: .18em; }
        .author .name { color: #7a302b; font-size: 1.05rem; font-weight: 700; letter-spacing: .12em; }
        .hint { margin-top: 22px; color: #867a65; font-size: .76rem; }
        @media (max-width:480px) { main { padding: 38px 22px 32px; border-radius: 24px; } .emblem { width: 78px; height: 78px; } }
    </style>
</head>
<body>
    <main>
        <div class="emblem" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        </div>
        <h1>荔香墨韵</h1>
        <p class="subtitle">岭南水墨音画作品</p>
        <audio controls preload="metadata">
            <source src="荔香墨韵.mp3" type="audio/mpeg">
            您的浏览器不支持音频播放。
        </audio>
        <div class="divider"></div>
        <div class="author"><span class="label">作者</span><span class="name">颜菲湘</span></div>
        <p class="hint">点击播放键，感受荔香与墨韵</p>
    </main>
</body>
</html>
