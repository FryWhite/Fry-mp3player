name: Update MP3 Website

on: 
  schedule:
    - cron: '0 */5 * * *' # 每5小时运行一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update last updated time
      run: |
        # 获取当前UTC时间并格式化
        CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        # 更新根目录 index.html 中的时间戳
        sed -i "s|<span id=\"update-time\">.*</span>|<span id=\"update-time\">$CURRENT_TIME</span>|g" index.html

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff --cached --quiet || git commit -m "Auto update last updated time"
        # 使用 GITHUB_TOKEN 认证推送
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git push