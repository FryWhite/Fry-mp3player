name: Deploy MP3 Website

on:
  push:
    branches: ["master"]
  schedule:
    - cron: '50 */5 * * *'    # 每5小时50分刷新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 更新时间戳
      - name: Update timestamp
        run: |
          sed -i "s|<span id=\"update-time\">.*</span>|<span id=\"update-time\">$(date -u +'%Y-%m-%d %H:%M:%S UTC')</span>|g" index.html

      # 提交时间戳更新
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto update [skip ci]"
          git push || true

      # 部署到 gh-pages 分支
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy site [skip ci]"